{% if messages %}
<div class="mb-4 space-y-2" role="alert">
    {% for message in messages %}
    <div class="rounded-lg border px-3 py-2.5 text-sm {% if 'error' in message.tags %}bg-red-50 border-red-200 text-red-800{% elif 'success' in message.tags %}bg-green-50 border-green-200 text-green-800{% elif 'warning' in message.tags %}bg-amber-50 border-amber-200 text-amber-900{% else %}bg-gray-50 border-gray-200 text-gray-800{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
