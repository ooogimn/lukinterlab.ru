# Локальный полигон и прод-образ: Postgres + Redis (+ опционально веб).
#
# Только БД и Redis (Django на хосте в .venv):
#   В корневом .env обязательны POSTGRES_*, REDIS_URL, DJANGO_Q_REDIS_* (см. env.example).
#   cp env.docker.example .env.docker; подставить пароль и DJANGO_SECRET_KEY
#   docker compose up -d postgres redis
#   POSTGRES_HOST=127.0.0.1 REDIS_URL=redis://127.0.0.1:6379/1 в .env для доступа с хоста
#   python manage.py migrate
#
# Полный стек: Gunicorn + воркер django-q (профиль full):
#   docker compose --profile full up -d --build
# После git pull на сервере обязательно build web (и qcluster) — код в образе, не bind-mount с хоста.
# Порт web слушает только на 127.0.0.1 (снаружи — nginx на хосте на :80/:443).
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lukinterlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lukinterlab_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lukinterlab}
    ports:
      - "${POSTGRES_PORT_PUBLISH:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_PUBLISH:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  web:
    profiles: ["full"]
    build: .
    # Один файл для секретов в контейнерах: .env.docker (рядом с compose). Корневой .env Django не подхватывает compose — дублируйте нужные ключи сюда.
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      DJANGO_Q_REDIS_HOST: redis
      DJANGO_Q_REDIS_PORT: "6379"
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn ALUKINTERLAB.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  qcluster:
    profiles: ["full"]
    build: .
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      DJANGO_Q_REDIS_HOST: redis
      DJANGO_Q_REDIS_PORT: "6379"
    command: python manage.py qcluster
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
