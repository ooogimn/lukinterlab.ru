{% comment %}
  Анимированный GIF как фон: <img> зацикливается надёжнее, чем background-image + fixed.
{% endcomment %}
{% if gif_url %}
{# Без width/height в разметке: при сбое CSS preflight Tailwind дал бы огромный блок в потоке #}
<img src="{{ gif_url }}" alt="" class="section-gif-background" loading="eager" fetchpriority="high" decoding="async">
{% endif %}
