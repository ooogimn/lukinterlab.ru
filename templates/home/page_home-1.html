{% block extra_head %}
<!-- Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<style>
    .service-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .service-card:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    .extra-swiper {
        padding: 20px 10px 50px !important;
    }
    .swiper-button-next, .swiper-button-prev {
        color: var(--primary-600) !important;
        background: white;
        width: 40px !important;
        height: 40px !important;
        border-radius: 50%;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .swiper-button-next:after, .swiper-button-prev:after {
        font-size: 18px !important;
    }
    .gradient-border {
        position: relative;
        border-radius: 1rem;
        padding: 1px;
        background: linear-gradient(to right, #3b82f6, #8b5cf6, #3b82f6);
        background-size: 200% 200%;
        animation: gradientMove 3s linear infinite;
    }
    .header-3d {
        text-shadow: 
            3px 3px 0px #1e40af,
            6px 6px 0px #1e3a8a,
            9px 9px 0px #1e3a8a,
            12px 12px 20px rgba(0, 0, 0, 0.3);
        transform: perspective(500px) rotateX(5deg);
        display: inline-block;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .header-3d:hover {
        transform: perspective(500px) rotateX(0deg) scale(1.05);
        text-shadow: 
            3px 3px 0px #1e40af,
            6px 6px 0px #1e3a8a,
            9px 9px 0px #1e3a8a,
            12px 12px 30px rgba(59, 130, 246, 0.5);
        color: #2563eb;
    }
    
    /* Portfolio Enhancements */
    .portfolio-card-glow {
        position: relative;
        transition: all 0.5s ease;
    }
    .portfolio-card-glow:hover {
        box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
    }
    .portfolio-card-glow::before {
        content: '';
        position: absolute;
        inset: -2px;
        background: linear-gradient(45deg, #3b82f6, #8b5cf6, #3b82f6);
        border-radius: 1.1rem;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.5s ease;
    }
    .portfolio-card-glow:hover::before {
        opacity: 0.6;
    }
    .line-clamp-custom {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
</style>
{% endblock extra_head %}

{% block extra_scripts %}
<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const extraSwiper = new Swiper('.extra-swiper', {
            slidesPerView: 1,
            spaceBetween: 30,
            loop: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            breakpoints: {
                640: {
                    slidesPerView: 2,
                },
                1024: {
                    slidesPerView: 3,
                },
            }
        });
    });
</script>
{% endblock extra_scripts %}
