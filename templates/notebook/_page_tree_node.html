<div class="border border-gray-200 rounded-lg p-4 {% if depth > 0 %}ml-6 bg-gray-50{% endif %}">
  <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
    <div>
      <a href="{% url 'Notebook:page_detail' node.page.id %}" class="text-lg font-semibold text-gray-900 hover:text-primary-700">
        {{ node.page.title }}
      </a>
      <div class="text-sm text-gray-500 mt-1">{{ node.page.get_folder_path }}</div>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="{% url 'Notebook:page_create_child' node.page.id %}" class="px-3 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">+ Подстраница</a>
      <a href="{% url 'Notebook:page_edit' node.page.id %}" class="px-3 py-2 text-sm bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors">Редактировать</a>
      <a href="{% url 'Notebook:page_delete' node.page.id %}" class="px-3 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">Удалить</a>
    </div>
  </div>

  {% if node.children %}
    <div class="mt-3 space-y-3">
      {% for child in node.children %}
        {% include "notebook/_page_tree_node.html" with node=child depth=depth|add:1 %}
      {% endfor %}
    </div>
  {% endif %}
</div>
