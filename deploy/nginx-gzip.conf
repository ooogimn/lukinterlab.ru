# Прод: /etc/nginx/conf.d/gzip.conf (подключается внутри http {} из nginx.conf).
# Сжатие HTML/CSS/JS/SVG/JSON: главная ~640 КБ → ~80-100 КБ по сети.
# gzip_proxied any — запросы приходят через фронтенд Jino (с заголовком Via), без этого nginx не сжимает.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;
