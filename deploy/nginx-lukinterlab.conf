# Прод lukinterlab.ru — /etc/nginx/conf.d/lukinterlab.conf на VPS Jino (81.177.139.241).
#
# Схема: посетитель → фронтенд Jino (HTTPS, сертификат на стороне Jino, IP 81.177.136.x)
#        → этот nginx :80 → gunicorn 127.0.0.1:8000 (контейнер web).
# Поэтому здесь только listen 80 и X-Forwarded-Proto https.
#
# /static/ и /media/ отдаёт nginx сам из папок проекта (bind-mount в контейнеры, см. docker-compose.yml):
# быстро, с Range (перемотка видео) и кэшем браузера, не занимая потоки gunicorn.
# Исключение — приватные папки /media/ (см. ниже): сначала проверка прав в Django.
# Сжатие gzip — в deploy/nginx-gzip.conf (/etc/nginx/conf.d/gzip.conf).
# Лимит загрузки — /etc/nginx/conf.d/00-upload-limit.conf (client_max_body_size).
#
# После правки: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name lukinterlab.ru www.lukinterlab.ru 81.177.139.241;

    # Статика после collectstatic с хэшем в имени (ALUKINTERLAB/storages.py).
    location /static/ {
        root /srv/lukinterlab.ru;
        access_log off;
        add_header X-Content-Type-Options nosniff;
        # Файлы без хэша (ссылки из JS/CSS напрямую): сутки + фоновое обновление.
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";

        # Хэшированные имена (style.3f2a9c1b7e4d.css) не меняются никогда — кэш на год.
        location ~* "\.[0-9a-f]{12}\.[a-z0-9]+$" {
            access_log off;
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Приватные загрузки (Блокнот, файлы заказов, вложения из формы контактов, аватары клиентов)
    # напрямую не отдаём: запрос идёт в Django, там проверка прав (home/private_media.py),
    # и при успехе Django отвечает X-Accel-Redirect на /_protected_media/ — файл отдаёт nginx.
    # Регулярка важнее обычного префикса /media/ ниже. Список папок — как PRIVATE_MEDIA_PREFIXES.
    location ~ ^/media/(wiki|contact_attachments|order_files|customer_avatars)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # HTML/SVG/XML из публичных загрузок — только скачиванием: подложенный файл не выполнит
    # скрипт на нашем домене при открытии по ссылке. В <img> SVG показывается как раньше.
    # Должна стоять ПОСЛЕ приватной регулярки (первая совпавшая регулярка выигрывает) и НЕ
    # внутри location /media/: вложенные регулярки nginx проверяет раньше верхних, и приватные
    # svg/html отдались бы с диска в обход проверки прав.
    location ~* ^/media/.+\.(html?|xhtml|svgz?|xml)$ {
        root /srv/lukinterlab.ru;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition "attachment";
    }

    # Только для внутреннего перенаправления из Django (снаружи — 404).
    # Content-Type, Content-Disposition и Cache-Control (private) приходят из ответа Django.
    location /_protected_media/ {
        internal;
        alias /srv/lukinterlab.ru/media/;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
    }

    # Загрузки пользователей и админки (картинки, видео). Имена при повторной загрузке
    # получают суффикс, у видео в шаблонах ?v=… — неделя кэша безопасна.
    location /media/ {
        root /srv/lukinterlab.ru;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
