# HTTP -> HTTPS (canonical host: apex)
server {
    listen 80;
    listen [::]:80;
    server_name lukinterlab.ru www.lukinterlab.ru;
    return 301 https://lukinterlab.ru$request_uri;
}

# www -> apex (HTTPS only)
server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name www.lukinterlab.ru;

    ssl_certificate /etc/letsencrypt/live/lukinterlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lukinterlab.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lukinterlab.ru$request_uri;
}

# main site (apex only)
server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name lukinterlab.ru;

    ssl_certificate /etc/letsencrypt/live/lukinterlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lukinterlab.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
