# Если после правок всё равно 413 и внизу страницы «nginx/…»:
#   nginx -T 2>/dev/null | grep -n client_max_body_size
# Убедитесь, что активен ЭТОТ server {} (или прод-копия с тем же лимитом).
# Иначе в /etc/nginx/nginx.conf внутри http { } один раз: client_max_body_size 1G;
# У CDN/балансера Jino лимит может быть в панели, а не в этом файле.
#
# HTTP -> HTTPS (canonical host: apex)
server {
    listen 80;
    listen [::]:80;
    server_name lukinterlab.ru www.lukinterlab.ru;
    return 301 https://lukinterlab.ru$request_uri;
}

# www -> apex (HTTPS only)
server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name www.lukinterlab.ru;

    ssl_certificate /etc/letsencrypt/live/lukinterlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lukinterlab.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lukinterlab.ru$request_uri;
}

# main site (apex only)
server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name lukinterlab.ru;

    ssl_certificate /etc/letsencrypt/live/lukinterlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lukinterlab.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Загрузки в админке (видео/GIF). Иначе nginx отдаёт 413, до Gunicorn запрос не доходит.
    client_max_body_size 1G;
    client_body_timeout 300s;

    # HTML/страницы: не кэшировать агрессивно — после деплоя сразу свежая версия.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-cache, private, must-revalidate" always;
    }

    # Статика Django: кэш без «immutable» (у файлов нет hash в имени — после деплоя иначе долго отдавалась бы старая CSS).
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
