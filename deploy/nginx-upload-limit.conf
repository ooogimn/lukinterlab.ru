# Прод: /etc/nginx/conf.d/00-upload-limit.conf (внутри http {}).
# Реальный потолок задаёт фронтенд Jino перед этим nginx: 1 ГиБ на запрос
# (проверено 2026-10-20: Content-Length 1073741824 проходит, 1073741825 → 413 от Jino).
# Форма портфолио ограничивает видео 1000 МБ (home/forms.py MAX_VIDEO_UPLOAD_BYTES).
client_max_body_size 1100M;
client_body_timeout 300s;
